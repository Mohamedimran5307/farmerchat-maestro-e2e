appId: ${APP_ID}
---
# ============================================================
# TAP SEND ON THE COMPOSER
# ============================================================
# Once text (or a photo) is entered, Voice becomes Send.
# Tries, in order: the composer testTag (composer_send_button, 4.1.7+), the
# legacy chat_send_btn (old Photo/Speak/Type UI behind a remote flag),
# then the "Send" label (older 4.1.x builds without the tag).
# Short settle timeout: the composer border animates continuously.
# ============================================================

- evalScript: ${output.composerSent = false}

- runFlow:
    when:
      visible:
        id: "composer_send_button"
    commands:
      - evalScript: ${output.composerSent = true}
      - tapOn:
          id: "composer_send_button"
          waitToSettleTimeoutMs: 500

- runFlow:
    when:
      true: ${!output.composerSent}
      visible:
        id: "chat_send_btn"
    commands:
      - evalScript: ${output.composerSent = true}
      - tapOn:
          id: "chat_send_btn"

- runFlow:
    when:
      true: ${!output.composerSent}
      visible: "Send"
    commands:
      - evalScript: ${output.composerSent = true}
      - tapOn:
          text: "Send"
          waitToSettleTimeoutMs: 500
- assertTrue: ${output.composerSent}
# Send time for wait_for_answer.yaml's latency check.
- evalScript: ${output.tSend = Date.now()}
