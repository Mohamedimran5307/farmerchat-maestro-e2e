appId: ${APP_ID}
---
# Gets from launch to home, whatever the app shows first. Idempotent: on a
# returning launch home comes first and every step below is skipped.

# Wait for whichever comes first — home or the language screen — instead
# of giving each its own timeout.
- extendedWaitUntil:
    visible:
      id: "home_screen|language_screen"
    timeout: 15000
    optional: true

# The "No internet" screen (error_screen) showed here once in ~120 runs;
# checking for it cost ~5s on every test, so a launch that hits it now
# fails at the home wait below and the runner's retry takes over.

# Pick language and tap "Start using FarmerChat"
- runFlow:
    when:
      visible:
        id: "language_screen"
    commands:
      # The screen first applies a default language (spinner on that
      # item) and drops the item tags until it's done, so allow for that.
      # 30 s, not 15: Maestro counts this limit from the last interaction
      # (launchApp), and on a slow phone the language screen alone can take
      # ~10 s — 15 s left only ~5 s for the list (Redmi, CI run #184, 3 Nov).
      # Returns as soon as the item shows, so fast phones lose nothing.
      - extendedWaitUntil:
          visible:
            id: "language_item_${LANGUAGE_CODE}"
          timeout: 30000
      - tapOn:
          id: "language_item_${LANGUAGE_CODE}"
      - extendedWaitUntil:
          visible:
            id: "language_start_button"
          timeout: 5000
      - tapOn:
          id: "language_start_button"

- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000
