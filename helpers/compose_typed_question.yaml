appId: ${APP_ID}
---
# ============================================================
# COMPOSE A TYPED QUESTION → send
# ============================================================
# Focuses the composer text field (home or chat screen), types
# ${QUESTION_TEXT}, hides the IME so Send isn't occluded on cramped
# displays, and taps Send. Caller is responsible for waiting on the AI answer
# (helpers/wait_for_answer.yaml) afterwards.
#
# QUESTION_TEXT is passed by the caller via runFlow env:
#   - runFlow:
#       file: ../../helpers/compose_typed_question.yaml
#       env:
#         QUESTION_TEXT: "How to grow maize"
# ============================================================

- runFlow: composer_focus_text.yaml
- inputText: "${QUESTION_TEXT}"
- hideKeyboard
- runFlow: composer_send.yaml
