appId: ${APP_ID}
---
# ============================================================
# TAP THE COMPOSER CAMERA BUTTON
# ============================================================
# Opens chat_photo_input_sheet (Camera / Photos).
# Tries, in order: the composer testTag (composer_photo_button, 4.1.7+), the
# legacy primary_input_photo_btn (old Photo/Speak/Type UI behind a remote flag),
# then the "Camera" label (older 4.1.x builds without the tag).
# Short settle timeout: the composer border animates continuously.
# ============================================================

- evalScript: ${output.composerPhoto = false}

- runFlow:
    when:
      visible:
        id: "composer_photo_button"
    commands:
      - evalScript: ${output.composerPhoto = true}
      - tapOn:
          id: "composer_photo_button"
          waitToSettleTimeoutMs: 500

- runFlow:
    when:
      true: ${!output.composerPhoto}
      visible:
        id: "primary_input_photo_btn"
    commands:
      - evalScript: ${output.composerPhoto = true}
      - tapOn:
          id: "primary_input_photo_btn"

- runFlow:
    when:
      true: ${!output.composerPhoto}
      visible: "Camera"
    commands:
      - evalScript: ${output.composerPhoto = true}
      - tapOn:
          text: "Camera"
          waitToSettleTimeoutMs: 500
- assertTrue: ${output.composerPhoto}

# Let the in-app sheet come up (absent on the legacy UI → optional).
- extendedWaitUntil:
    visible:
      id: "chat_photo_input_sheet"
    timeout: 3000
    optional: true
