appId: ${APP_ID}
---
# ============================================================
# TAP THE COMPOSER VOICE BUTTON
# ============================================================
# Opens the "Listening..." voice-input overlay. Tries the "Voice"
# content-desc (4.1.5 exposes no id yet — composer_voice_button is
# requested in TESTTAG_REQUESTS.md), then the legacy
# primary_input_speak_btn. Grants the RECORD_AUDIO runtime prompt if
# it appears (first voice tap on a fresh install; CI pre-grants it).
# ============================================================

- evalScript: ${output.composerVoice = false}

- runFlow:
    when:
      visible: "Voice"
    commands:
      - evalScript: ${output.composerVoice = true}
      - tapOn:
          text: "Voice"
          waitToSettleTimeoutMs: 500

- runFlow:
    when:
      true: ${!output.composerVoice}
      visible:
        id: "primary_input_speak_btn"
    commands:
      - evalScript: ${output.composerVoice = true}
      - tapOn:
          id: "primary_input_speak_btn"
- assertTrue: ${output.composerVoice}

- runFlow: grant_runtime_permission.yaml
