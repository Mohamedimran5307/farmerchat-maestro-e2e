appId: ${APP_ID}
---
# ============================================================
# TAP THE COMPOSER VOICE BUTTON
# ============================================================
# Opens voice input. Grants the RECORD_AUDIO runtime prompt if it
# appears (first voice tap on a fresh install; CI pre-grants it).
# Tries, in order: the composer testTag (composer_voice_button, 4.1.7+), the
# legacy primary_input_speak_btn (old Photo/Speak/Type UI behind a remote flag),
# then the "Voice" label (older 4.1.x builds without the tag).
# Short settle timeout: the composer border animates continuously.
# ============================================================

- evalScript: ${output.composerVoice = false}

- runFlow:
    when:
      visible:
        id: "composer_voice_button"
    commands:
      - evalScript: ${output.composerVoice = true}
      - tapOn:
          id: "composer_voice_button"
          waitToSettleTimeoutMs: 500

- runFlow:
    when:
      true: ${!output.composerVoice}
      visible:
        id: "primary_input_speak_btn"
    commands:
      - evalScript: ${output.composerVoice = true}
      - tapOn:
          id: "primary_input_speak_btn"

- runFlow:
    when:
      true: ${!output.composerVoice}
      visible: "Voice"
    commands:
      - evalScript: ${output.composerVoice = true}
      - tapOn:
          text: "Voice"
          waitToSettleTimeoutMs: 500
- assertTrue: ${output.composerVoice}

- runFlow: grant_runtime_permission.yaml
