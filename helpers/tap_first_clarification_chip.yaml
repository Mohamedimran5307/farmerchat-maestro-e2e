appId: ${APP_ID}
---
# ============================================================
# TAP THE FIRST CHIP OF AN AGENTIC CLARIFICATION CARD
# ============================================================
# Called by wait_for_answer.yaml when a clarification is on screen.
#   - Photo card (chat_clarification_card_photo): the ONE exception to
#     "first chip" — always "Continue without photo"
#     (chat_clarification_option_skip).
#   - Location card (chat_clarification_card_location): first chip is
#     "Give permission" → also grants the Android location prompt.
#   - Any other card (crop, stage, pest …): chat_clarification_option_0;
#     a confirmation card that comes BEFORE the answer ("Please Confirm",
#     seen 2 Nov): chat_confirmation_option_0.
# Answered cards stay in the chat with the same tags, but the chosen
# option shows a tick instead of its number. The tests always answer
# option 0 (or skip on the photo card), so the pending card is the one
# whose option still holds its number — "1" in option 0, a digit in the
# skip option. That also keeps an older answer's suggestion "1" out.
# Output: output.chipDone = true when a chip was tapped.
# ============================================================

- evalScript: ${output.chipDone = false}
- evalScript: ${output.photoCard = false}

# ── Photo card → "Continue without photo" ──
- runFlow:
    when:
      visible:
        id: "chat_clarification_card_photo"
    commands:
      - evalScript: ${output.photoCard = true}
      - runFlow:
          when:
            visible:
              id: "chat_clarification_option_skip"
              containsDescendants:
                - text: "[0-9]"
          commands:
            - tapOn:
                id: "chat_clarification_option_skip"
                containsDescendants:
                  - text: "[0-9]"
            - evalScript: ${output.chipDone = true}
            - evalScript: ${console.log('[AGENTIC] clarification answered - photo, continue without a photo')}

# ── Location card → option 0 ("Give permission") + the system prompt ──
- runFlow:
    when:
      true: ${!output.chipDone && !output.photoCard}
      visible:
        id: "chat_clarification_card_location"
    commands:
      - runFlow:
          when:
            visible:
              id: "chat_clarification_option_0"
              containsDescendants:
                - text: "1"
          commands:
            - tapOn:
                id: "chat_clarification_option_0"
                containsDescendants:
                  - text: "1"
            - runFlow: grant_runtime_permission.yaml
            - evalScript: ${output.chipDone = true}
            - evalScript: ${console.log('[AGENTIC] clarification answered - location, first chip')}

# ── Any other card → option 0 ──
- runFlow:
    when:
      true: ${!output.chipDone && !output.photoCard}
      visible:
        id: "chat_(clarification|confirmation)_option_0"
        containsDescendants:
          - text: "1"
    commands:
      # Its label is only logged (the accessibility bug can drop a chip's
      # text, so read it only when it's there).
      - evalScript: ${output.chipLabel = ''}
      - runFlow:
          when:
            visible:
              text: "(?!1$).{2,}"
              childOf:
                id: "chat_(clarification|confirmation)_option_0"
                containsDescendants:
                  - text: "1"
          commands:
            - copyTextFrom:
                text: "(?!1$).{2,}"
                childOf:
                  id: "chat_(clarification|confirmation)_option_0"
                  containsDescendants:
                    - text: "1"
            - evalScript: ${output.chipLabel = maestro.copiedText || ''}
      - tapOn:
          id: "chat_(clarification|confirmation)_option_0"
          containsDescendants:
            - text: "1"
      - evalScript: ${output.chipDone = true}
      - evalScript: ${console.log('[AGENTIC] clarification answered - first chip - ' + output.chipLabel)}
