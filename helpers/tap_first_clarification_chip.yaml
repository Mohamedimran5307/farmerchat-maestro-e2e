appId: ${APP_ID}
---
# ============================================================
# TAP THE FIRST CHIP OF AN AGENTIC CLARIFICATION CARD
# ============================================================
# Called by wait_for_answer.yaml when a clarification is on screen.
#   - Photo card ("Add one clear photo": Take a photo / Choose a photo /
#     Continue without one): the ONE exception to "first chip" — always
#     "Continue without one" (agreed rule: tests stay text-only here).
#   - Location card ("Share location"): first chip is "Give permission"
#     → also grants the Android location prompt that follows.
#   - Other cards ("Choose one" / "Which crop …?" … footer "Don't see
#     your option? Type or say it."): first chip = the option numbered 1.
# wait_for_answer.yaml doesn't scroll while the agent is thinking, so a
# card arrives in view top-first; option 1 is found below the card's title
# ("Choose one"), which keeps an older answer's suggestion "1" from being
# picked. Cards without a title fall back to the footer anchor.
# After a numbered chip is tapped, the chat must echo its label as the
# user's next message (the choice took effect).
# No testTags yet (requested: chat_clarification_option_0).
# ============================================================

- evalScript: ${output.chipDone = false}

# ── Photo card → always "Continue without one" (3rd chip) ──
# Detected by the card's title: once answered, the card is replaced by the
# echo "Continue without one" as the user's message, which must not count.
- runFlow:
    when:
      visible: "Add one clear photo.*"
    commands:
      - tapOn:
          text: "Continue without one"
          below:
            text: "Add one clear photo.*"
      - evalScript: ${output.chipDone = true}
      - evalScript: ${console.log('[AGENTIC] clarification answered - photo, continue without one')}

# ── Location card ──
- runFlow:
    when:
      true: ${!output.chipDone}
      visible: "Share location"
    commands:
      - scrollUntilVisible:
          centerElement: false
          element:
            text: "1"
            below:
              text: "Share location"
          direction: UP
          timeout: 6000
          optional: true
      - tapOn:
          text: "1"
          below:
            text: "Share location"
      - runFlow: grant_runtime_permission.yaml
      - evalScript: ${output.chipDone = true}
      - evalScript: ${console.log('[AGENTIC] clarification answered - location, first chip')}

# ── Cards with a "Choose one" title (crop, stage, pest …) ──
# wait_for_answer doesn't scroll while the agent is thinking, so the card
# lands in view top-first: title + option 1 are on screen; the footer may
# not be. Anchor to the title. Answered cards stay in the chat, but their
# chosen option shows a tick instead of "1", so the first "1" below a
# "Choose one" is always the current card's option 1.
- runFlow:
    when:
      true: ${!output.chipDone}
      visible: "Choose one"
    commands:
      # No-op when option 1 is already visible (the usual case).
      - scrollUntilVisible:
          centerElement: false
          element:
            text: "1"
            below:
              text: "Choose one"
          direction: DOWN
          timeout: 4000
          speed: 40
          optional: true
      # Option 1's label: right of "1" and above "2" in this card (the
      # hierarchy also holds hidden text, e.g. "Overview", that a looser
      # selector picks up first).
      - evalScript: ${output.chipLabel = ''}
      - runFlow:
          when:
            visible:
              text: "2"
              below:
                text: "Choose one"
          commands:
            - copyTextFrom:
                text: "(?!Listen$|Share$).{2,}"
                rightOf:
                  text: "1"
                  below:
                    text: "Choose one"
                below:
                  text: "Choose one"
                above:
                  text: "2"
                  below:
                    text: "Choose one"
            - evalScript: ${output.chipLabel = maestro.copiedText || ''}
      - runFlow:
          when:
            true: ${output.chipLabel == ''}
          commands:
            - evalScript: ${console.log('[NOTE] Chip label not captured - echo check skipped')}
      - tapOn:
          text: "1"
          below:
            text: "Choose one"
      - evalScript: ${output.chipDone = true}
      - evalScript: ${console.log('[AGENTIC] chip tapped - ' + output.chipLabel)}
      # The choice took effect: the chat echoes it as the user's message.
      - evalScript: ${output.chipLabelRe = String(output.chipLabel).replace(/\\/g, '\\\\').replace(/\?/g, '\\?').replace(/\./g, '\\.').replace(/\(/g, '\\(').replace(/\)/g, '\\)').replace(/\*/g, '\\*').replace(/\+/g, '\\+').replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\|/g, '\\|')}
      - runFlow:
          when:
            true: ${output.chipLabel != ''}
          commands:
            - extendedWaitUntil:
                visible:
                  id: "chat_user_message"
                  containsDescendants:
                    - text: ${output.chipLabelRe}
                timeout: 10000
                label: "Chip choice echoed as the user's message"

# ── Fallback: a card without a "Choose one" title, found by its footer.
#    Option 1 is the first "1" above the footer (scroll up to it). ──
- runFlow:
    when:
      true: ${!output.chipDone}
      visible: "Don't see your option.*"
    commands:
      - scrollUntilVisible:
          centerElement: false
          element:
            text: "1"
            above:
              text: "Don't see your option.*"
          direction: UP
          timeout: 6000
          speed: 40
          optional: true
      - tapOn:
          text: "1"
          above:
            text: "Don't see your option.*"
      - evalScript: ${output.chipDone = true}
      - evalScript: ${console.log('[NOTE] Clarification card without a Choose one title - first chip tapped, label/echo not checked')}
- evalScript: ${console.log('[AGENTIC] clarification answered - first chip')}
