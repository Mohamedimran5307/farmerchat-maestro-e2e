appId: ${APP_ID}
---
# ============================================================
# WAIT FOR THE AI ANSWER (non-agentic + agentic) → check it
# ============================================================
# Call right after a question is sent (or a card / weather chat is
# opened). Optional inputs:
#   output.answerLabel      names this answer in the [AGENTIC] log lines
#   output.handleFollowUps  true = also handle what the agent posts AFTER
#                           the answer (confirmation cards: save crop,
#                           gender; late clarifications) until the
#                           follow-up questions show. Only FC-CHAT-01
#                           (TC03) sets it; every other test stops once
#                           the answer is done and asserts Share only —
#                           each extra agent turn costs time and saves
#                           data to the account.
#   output.sameChat         true = a second question in a chat that already
#                           has an answer; waits for that answer's Share
#                           row to leave the screen first. Reset here.
#   output.answerBudgetMs   hang-guard limit for the whole wait (default
#                           300000 = 5 min).
#
# Agentic builds (4.1.7+) may first ask a clarification (a card of
# numbered chips: chat_clarification_card, _option_<n>) and may end with a
# confirmation card (save crop / gender). Rule: always tap the FIRST chip
# — except the photo card, where it's "Continue without photo"
# (chip 3, chat_clarification_option_2). See tap_first_clarification_chip.yaml.
#
# Functional checks only (what the AI says is covered by the evals
# project). Failures: the answer completed (action row / suggestions),
# it isn't the inline error or the "Sorry, I had a problem" reply, and it
# has real text (a line of ≥ 20 characters — weather answers are cards of
# short lines). No performance limit: one sample says nothing about
# performance (that's measured in the backend). Only a hang guard: the
# whole wait fails after 5 min instead of running every pass.
# Logs: [AGENTIC] clarifications / confirmation.
#
# Speed: every Maestro check on an element that isn't there costs ~3.5s
# (the app's animations never let the screen settle), so checks are kept
# to a minimum.
# ============================================================

- evalScript: ${output.clarifications = 0}

# ── A second question in the same chat (caller sets output.sameChat, as
#    followup_via_suggestion.yaml does): the previous answer's Share row /
#    suggestions must leave the screen first — otherwise they'd pass for
#    the new answer before it has arrived. (The app scrolls the new
#    question to the top, so they go within a second or two.) ──
- runFlow:
    when:
      true: ${output.sameChat === true}
    commands:
      - extendedWaitUntil:
          notVisible:
            id: "chat_share_btn|chat_suggested_questions"
          timeout: 15000
          label: "Previous answer left the screen (only the new turn is checked)"
- evalScript: ${output.sameChat = false}

# ── Hang guard: the whole wait (cards + answer) gets one limit, 5 min by
#    default (output.answerBudgetMs overrides). Not a performance check —
#    a normal agentic answer with two cards takes 1–2 min — it only stops
#    a stuck chat from running all 8 passes (~15 min) before failing. ──
- evalScript: ${output.answerStart = Date.now()}
- evalScript: ${output.answerBudget = output.answerBudgetMs || 300000}
- evalScript: ${output.overBudget = false}

# ── Watch first, scroll later. While the app shows its loader
#    (chat_loading, "Getting your answer…") nothing is scrolled: the screen stays still and
#    whatever arrives (a clarification card or the answer) lands in view —
#    the app doesn't follow the answer down, it shows it from its top.
#    Only once the loader is gone and no chip card is showing do we scroll
#    DOWN to the end of the answer (action row / suggestions). If the
#    loader is never seen (it came and went between checks) the loop falls
#    back to scrolling, so it still terminates.
#    A pending card is found by its option still holding its number: an
#    answered card keeps its tags but shows a tick on the chosen option.
#    Before the answer a confirmation card ("Please Confirm": step-by-step
#    plan / short overview, seen 2 Nov) blocks it too, so it's answered
#    like a clarification. If the option's number has dropped out of the
#    tree, the card's "Type or say it" footer marks it as still waiting. ──
- repeat:
    while:
      notVisible:
        id: "chat_share_btn|chat_suggested_questions"
    times: 8
    commands:
      - evalScript: ${output.overBudget = Date.now() - output.answerStart > output.answerBudget}
      - runFlow:
          when:
            true: ${!output.overBudget}
          commands:
            - evalScript: ${output.chipThisPass = false}
            - extendedWaitUntil:
                visible:
                  id: "chat_loading"
                timeout: 4000
                optional: true
            - extendedWaitUntil:
                notVisible:
                  id: "chat_loading"
                timeout: 90000
                optional: true
            - runFlow:
                when:
                  visible:
                    id: "chat_(clarification|confirmation)_option_(0|skip)"
                    containsDescendants:
                      - text: "[0-9]"
                commands:
                  - runFlow: tap_first_clarification_chip.yaml
                  # Only a tapped chip counts (an answered photo card still has a
                  # numbered option 0 → then scroll on, don't loop on it).
                  - evalScript: ${output.chipThisPass = output.chipDone == true}
                  - evalScript: "${output.clarifications = output.clarifications + (output.chipThisPass ? 1 : 0)}"
            # The option's number can drop out of the tree (accessibility bug,
            # seen 3 Nov in CI) — then the pending card is found by its
            # "Type or say it" footer, which only a card still waiting has.
            - runFlow:
                when:
                  true: ${!output.chipThisPass}
                  visible:
                    id: "chat_clarification_type_instead"
                commands:
                  - runFlow: tap_first_clarification_chip.yaml
                  - evalScript: ${output.chipThisPass = output.chipDone == true}
                  - evalScript: "${output.clarifications = output.clarifications + (output.chipThisPass ? 1 : 0)}"
            - runFlow:
                when:
                  true: ${!output.chipThisPass}
                commands:
                  - scrollUntilVisible:
                      centerElement: false
                      element:
                        id: "chat_share_btn|chat_suggested_questions"
                      direction: DOWN
                      timeout: 10000
                      speed: 75
                      optional: true
- runFlow:
    when:
      true: ${output.overBudget}
    commands:
      - assertVisible:
          id: "chat_share_btn|chat_suggested_questions"
          label: "Answer completed within the hang-guard limit (5 min)"
- assertVisible:
    id: "chat_share_btn|chat_suggested_questions"
    label: "Answer completed (action row or suggestions shown)"

# ── Real answer: not the inline error, not the failure reply, has text ──
- assertNotVisible:
    id: "chat_retry_btn"
    label: "Answer is not the inline error"
# The backend's failure reply looks like a normal answer (Share/Listen row,
# no Retry button). The 2 Nov build tags it chat_ai_message_error; its
# wording is still checked until that tag has been seen on a failure reply.
- assertNotVisible:
    id: "chat_ai_message_error"
    label: "Answer is not the failure reply (tag)"
- assertNotVisible:
    text: "(?is).*(had a problem just now|ask your question again).*"
    childOf:
      id: "chat_ai_message"
    label: "Answer is not the 'Sorry, I had a problem' failure reply"
# The screen is at the end of the answer now; a short-line answer (weather
# cards) can have its longer lines above it, so look up for one.
- scrollUntilVisible:
    centerElement: false
    element:
      text: "(?s).{20,}"
      childOf:
        id: "chat_ai_message"
    direction: UP
    timeout: 10000
    optional: true
- assertVisible:
    text: "(?s).{20,}"
    childOf:
      id: "chat_ai_message"
    label: "Answer has real text (a line of ≥ 20 characters)"
- evalScript: ${console.log('[AGENTIC] ' + (output.answerLabel || 'answer') + ' - clarifications=' + output.clarifications)}

# ── (Only with output.handleFollowUps.) After the answer the agent may
#    still post cards: a confirmation
#    (save crop, gender …) or another clarification — sometimes seconds
#    after the answer (seen 19 Oct: a "save rice" card arrived after the
#    check had run; a symptom card followed a confirmation). Keep handling
#    whatever arrives at the end of the chat until the follow-up questions
#    show (up to 4 rounds): tap its first chip (photo card: "Continue
#    without photo"), wait for the agent's next
#    turn. Cards are looked for BELOW the answer's Share row, so answered
#    cards from before the answer don't count. What a card says is not
#    checked (AI content — covered by the evals project). ──
- runFlow:
    when:
      true: ${output.handleFollowUps === true}
    commands:
      - repeat:
          while:
            notVisible:
              id: "chat_suggested_questions"
          times: 4
          commands:
            # Gives a late card / the suggestions time to arrive and brings the
            # end of the chat into view.
            - scrollUntilVisible:
                centerElement: false
                element:
                  id: "chat_suggested_questions"
                direction: DOWN
                timeout: 8000
                optional: true
            - evalScript: ${output.lateTapped = false}
            # A pending clarification card (an option still numbered).
            - runFlow:
                when:
                  visible:
                    id: "chat_clarification_option_(0|skip)"
                    containsDescendants:
                      - text: "[0-9]"
                    below:
                      id: "chat_share_btn"
                commands:
                  - runFlow: tap_first_clarification_chip.yaml
                  - evalScript: ${output.lateTapped = output.chipDone == true}
                  - evalScript: ${console.log('[AGENTIC] ' + (output.answerLabel || 'answer') + ' - clarification after the answer answered')}
            # A confirmation card (save crop, gender …), by its tag — a plain
            # "1" under the Share row also matches a suggestion row when the
            # suggestions block drops out of the tree (seen 20 Oct: a suggestion
            # was tapped as if it were a confirmation).
            - runFlow:
                when:
                  true: ${!output.lateTapped}
                  visible:
                    id: "chat_confirmation_option_0"
                commands:
                  # Its label is only logged; the app's accessibility bug can collapse
                  # the chip to a node without text, so read it only when it's there.
                  - evalScript: ${output.confLabel = ''}
                  - runFlow:
                      when:
                        visible:
                          text: "(?!1$).{2,}"
                          childOf:
                            id: "chat_confirmation_option_0"
                      commands:
                        - copyTextFrom:
                            text: "(?!1$).{2,}"
                            childOf:
                              id: "chat_confirmation_option_0"
                        - evalScript: ${output.confLabel = maestro.copiedText || ''}
                  - tapOn:
                      id: "chat_confirmation_option_0"
                  - evalScript: ${console.log('[AGENTIC] ' + (output.answerLabel || 'answer') + ' - confirmation answered with first chip - ' + output.confLabel)}
                  - evalScript: ${output.lateTapped = true}
            # After a tap, let the agent finish its next turn.
            - runFlow:
                when:
                  true: ${output.lateTapped}
                commands:
                  - extendedWaitUntil:
                      visible:
                        id: "chat_loading"
                      timeout: 4000
                      optional: true
                  - extendedWaitUntil:
                      notVisible:
                        id: "chat_loading"
                      timeout: 90000
                      label: "Agent finished its turn after the card"
