appId: ${APP_ID}
---
# ============================================================
# FOCUS THE COMPOSER TEXT FIELD (home or chat screen)
# ============================================================
# The composer ([Camera] [field] [Voice]) replaced the old
# Photo/Speak/Type trio.
# Tries, in order: the composer testTag (composer_text_field, 4.1.7+), the
# legacy primary_input_type_btn (old Photo/Speak/Type UI behind a remote flag),
# then the "Ask about your farm..." label (older 4.1.x builds without the tag).
# Short settle timeout: the composer border animates continuously.
# ============================================================

- evalScript: ${output.composerFocused = false}

- runFlow:
    when:
      visible:
        id: "composer_text_field"
    commands:
      - evalScript: ${output.composerFocused = true}
      - tapOn:
          id: "composer_text_field"
          waitToSettleTimeoutMs: 500

- runFlow:
    when:
      true: ${!output.composerFocused}
      visible:
        id: "primary_input_type_btn"
    commands:
      - evalScript: ${output.composerFocused = true}
      - tapOn:
          id: "primary_input_type_btn"
      - extendedWaitUntil:
          visible:
            id: "chat_text_input"
          timeout: 5000
      - tapOn:
          id: "chat_text_input"

- runFlow:
    when:
      true: ${!output.composerFocused}
      visible: "Ask about your farm..."
    commands:
      - evalScript: ${output.composerFocused = true}
      - tapOn:
          text: "Ask about your farm..."
          waitToSettleTimeoutMs: 500
- assertTrue: ${output.composerFocused}
