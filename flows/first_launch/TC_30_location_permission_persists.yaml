appId: ${APP_ID}
name: "TC30 - Location Permission Persists After Grant"
# id: FC-LOC-03
# priority: P1
# description: Location granted once is still used after the app restarts: weather opens the chat directly and answers without asking for location.
tags:
  - chat
  - regression
  - first_launch
---
- launchApp:
    clearState: true
    permissions:
      location: unset
- runFlow: ../../helpers/complete_onboarding.yaml

# ── Grant once ──
- tapOn:
    id: "home_weather_button"
- extendedWaitUntil:
    visible:
      id: "location_interstitial_screen"
    timeout: 15000
    label: "Share-location screen shown (location not granted yet)"
- tapOn:
    id: "location_interstitial_cta_btn"
- extendedWaitUntil:
    visible:
      id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button|com.android.permissioncontroller:id/permission_allow_button"
    timeout: 10000
    label: "System location prompt shown"
- runFlow: ../../helpers/grant_runtime_permission.yaml
# Google's location-accuracy pop-up (device-dependent).
- runFlow:
    when:
      visible: "No thanks"
    commands:
      - tapOn: "No thanks"
- tapOn:
    id: "appbar_logo_left_btn"
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000

# ── Restart the app (state kept) ──
# "Persists" means after a restart, not just later in the same session.
- stopApp
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

# ── Second visit: straight to the chat ──
- tapOn:
    id: "home_weather_button"
- extendedWaitUntil:
    visible:
      id: "chat_screen"
    timeout: 15000
    label: "After a restart, weather opens the chat directly"
- assertNotVisible:
    id: "location_interstitial_screen"
    label: "No share-location screen after the restart"
- assertNotVisible:
    id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button|com.android.permissioncontroller:id/permission_allow_button"
    label: "No system permission prompt after the restart"

# The grant really took effect: once the agent's first turn is in, it
# hasn't asked for location. Checked before wait_for_answer, which would
# tap the card's first chip and hide the problem.
- extendedWaitUntil:
    visible:
      text: "Getting your .*"
    timeout: 4000
    optional: true
- extendedWaitUntil:
    notVisible:
      text: "Getting your .*"
    timeout: 90000
- assertNotVisible:
    id: "chat_clarification_card_location"
    label: "Chat doesn't ask for location (the grant is used)"
- evalScript: ${output.answerLabel = 'weather_answer'}
- runFlow: ../../helpers/wait_for_answer.yaml
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_share_btn"
    direction: DOWN
    timeout: 10000
    label: "Scroll to the Share button"
- assertVisible:
    id: "chat_share_btn"
    label: "Share button shown on the answer"
- tapOn:
    id: "appbar_logo_left_btn"
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000
    label: "Back on the home screen"
