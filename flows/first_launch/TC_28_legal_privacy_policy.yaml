appId: ${APP_ID}
name: "TC28 - First-Launch: Verify Privacy Policy Link in Language-Screen Legal Text"
# id: FC-LEGAL-02
# priority: P2
# quarantine: Blocked by missing tags (4.1.7) — the Terms / Privacy links on the language screen are not separate tagged elements (language_terms_btn / language_privacy_btn don't exist), so they can't be tapped. Requested in TESTTAG_REQUESTS_CRITICAL.md (row 8). Remove once the tags ship.
# description: Language screen's legal text shows the Privacy Policy link.
# Same caveat as TC29 — the embedded "Privacy Policy" link is a
# Compose AnnotatedString span without its own accessibility node,
# and a Maestro tap on the legal_text TextView does NOT route to the
# span's click handler. Until the app team exposes each link as its
# own clickable Composable with a dedicated testTag (e.g.
# language_privacy_btn), this test is reduced from "open Privacy
# dialog" to "verify the Privacy link is at least present in the
# rendered legal text."
tags:
  - onboarding
  - legal
  - regression
  - first_launch
---
- launchApp

- runFlow:
    when:
      visible:
        text: "Try again"
    commands:
      - tapOn: "Try again"

- extendedWaitUntil:
    visible:
      id: "language_screen"
    timeout: 30000

# Pick English so the legal text renders in the language we can assert
# against. The default-selected language varies by device locale.
- extendedWaitUntil:
    visible:
      id: "language_item_${LANGUAGE_CODE}"
    timeout: 5000
- tapOn:
    id: "language_item_${LANGUAGE_CODE}"

- assertVisible:
    id: "language_legal_text"
- assertVisible:
    id: "language_privacy_btn"
- tapOn:
    id: "language_privacy_btn"


# Verify the Terms document opens. "Terms of Use" stays visible because
# it's typically also the title of the opened document.
- extendedWaitUntil:
    visible:
      text: "Privacy Policy"
    timeout: 10000
- assertVisible:
    text: "Privacy Policy"