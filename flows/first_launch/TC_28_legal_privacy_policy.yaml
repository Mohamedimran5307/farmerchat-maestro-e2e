appId: ${APP_ID}
name: "TC28 - First-Launch: Open Privacy Policy from Language Screen"
# id: FC-LEGAL-02
# priority: P2
# description: Language screen's Privacy Policy link opens the document.
# The document page has no testTags yet (legal_document_screen / _title
# requested), so its title is still matched by text.
tags:
  - onboarding
  - legal
  - regression
  - first_launch
---
- launchApp

- runFlow:
    when:
      visible:
        text: "Try again"
    commands:
      - tapOn: "Try again"

- extendedWaitUntil:
    visible:
      id: "language_screen"
    timeout: 30000

- extendedWaitUntil:
    visible:
      id: "language_item_${LANGUAGE_CODE}"
    timeout: 5000
- tapOn:
    id: "language_item_${LANGUAGE_CODE}"

- extendedWaitUntil:
    visible:
      id: "language_privacy_btn"
    timeout: 10000
- assertVisible:
    id: "language_legal_text"
- tapOn:
    id: "language_privacy_btn"

# The Privacy Policy document opens.
- extendedWaitUntil:
    visible:
      text: "Privacy Policy"
    timeout: 15000
- assertNotVisible:
    id: "language_screen"
