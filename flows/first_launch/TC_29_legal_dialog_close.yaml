appId: ${APP_ID}
name: "TC29 - First-Launch: Open and Close Both Legal Documents"
# id: FC-LEGAL-03
# priority: P2
# description: Each legal document closes back to the language screen.
# Opens Terms, closes it, opens Privacy, closes it. Closed with the
# system Back: the page's X button has no testTag yet
# (appbar_default_left_btn / legal_document_* requested).
tags:
  - onboarding
  - legal
  - regression
  - first_launch
---
- launchApp

- runFlow:
    when:
      visible:
        text: "Try again"
    commands:
      - tapOn: "Try again"

- extendedWaitUntil:
    visible:
      id: "language_screen"
    timeout: 30000

- extendedWaitUntil:
    visible:
      id: "language_item_${LANGUAGE_CODE}"
    timeout: 5000
- tapOn:
    id: "language_item_${LANGUAGE_CODE}"
- extendedWaitUntil:
    visible:
      id: "language_terms_btn"
    timeout: 10000
- assertVisible:
    id: "language_privacy_btn"

# Terms: open → close → back on the language screen.
- tapOn:
    id: "language_terms_btn"
- extendedWaitUntil:
    visible:
      text: "Terms of Use"
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: "language_screen"
    timeout: 5000

# Privacy: open → close → back on the language screen.
- tapOn:
    id: "language_privacy_btn"
- extendedWaitUntil:
    visible:
      text: "Privacy Policy"
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: "language_screen"
    timeout: 5000

# Still usable: the legal links and the Start button are there.
- assertVisible:
    id: "language_terms_btn"
- assertVisible:
    id: "language_start_button"
