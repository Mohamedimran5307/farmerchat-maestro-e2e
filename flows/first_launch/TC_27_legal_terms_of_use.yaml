appId: ${APP_ID}
name: "TC27 - First-Launch: Open Terms of Use from Language Screen"
# id: FC-LEGAL-01
# priority: P2
# description: Language screen's Terms of Use link opens the document.
# The legal links render after a language is picked. The document page
# has no testTags yet (legal_document_screen / _title requested), so its
# title is still matched by text.
tags:
  - onboarding
  - legal
  - regression
  - first_launch
---
- launchApp

# Handle the "Try again" fallback if the language fetch fails initially.
- runFlow:
    when:
      visible:
        text: "Try again"
    commands:
      - tapOn: "Try again"

- extendedWaitUntil:
    visible:
      id: "language_screen"
    timeout: 30000

# Pick the configured language so the legal text renders.
- extendedWaitUntil:
    visible:
      id: "language_item_${LANGUAGE_CODE}"
    timeout: 5000
- tapOn:
    id: "language_item_${LANGUAGE_CODE}"

- extendedWaitUntil:
    visible:
      id: "language_terms_btn"
    timeout: 10000
- assertVisible:
    id: "language_legal_text"
- tapOn:
    id: "language_terms_btn"

# The Terms document opens.
- extendedWaitUntil:
    visible:
      text: "Terms of Use"
    timeout: 15000
- assertNotVisible:
    id: "language_screen"
