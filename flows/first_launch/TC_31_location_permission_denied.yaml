appId: ${APP_ID}
name: "TC31 - Location Denied → Continue Without Location → Answer"
# id: FC-LOC-04
# priority: P1
# description: With location denied, weather still answers after Continue without location.
tags:
  - chat
  - regression
  - first_launch
---
- launchApp:
    clearState: true
    permissions:
      location: unset
- runFlow: ../../helpers/complete_onboarding.yaml

- tapOn:
    id: "home_weather_button"
- extendedWaitUntil:
    visible:
      id: "location_interstitial_screen"
    timeout: 15000
    label: "Share-location screen shown (location not granted yet)"
- tapOn:
    id: "location_interstitial_cta_btn"
- extendedWaitUntil:
    visible:
      id: "com.android.permissioncontroller:id/permission_deny_button"
    timeout: 10000
    label: "System location prompt shown"
- tapOn:
    id: "com.android.permissioncontroller:id/permission_deny_button"

# ── Denied: the prompt closes and the chat opens anyway ──
- extendedWaitUntil:
    visible:
      id: "chat_screen"
    timeout: 15000
    label: "Chat opens after denying"
- assertNotVisible:
    id: "com.android.permissioncontroller:id/permission_deny_button"
    label: "System prompt closed"
- assertNotVisible:
    id: "location_interstitial_screen"
    label: "Share-location screen closed"
- extendedWaitUntil:
    visible:
      id: "chat_clarification_card_location"
    timeout: 60000
    label: "Chat asks for location (it was denied)"

# ── Decline in the chat too → complete answer ──
# Tapped here, not by wait_for_answer: it would pick the first chip
# ("Give permission").
- tapOn:
    id: "chat_clarification_option_1"
    label: "Tap Continue without location"
- evalScript: ${output.answerLabel = 'weather_answer'}
- runFlow: ../../helpers/wait_for_answer.yaml
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 15000
    label: "Scroll to the follow-up questions"
- assertVisible:
    id: "chat_suggested_questions"
    label: "Follow-up questions shown after the answer"
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_share_btn"
    direction: UP
    timeout: 10000
    label: "Scroll to the Share button"
- assertVisible:
    id: "chat_share_btn"
    label: "Share button shown on the answer"

- tapOn:
    id: "appbar_logo_left_btn"
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000
    label: "Back on the home screen"
