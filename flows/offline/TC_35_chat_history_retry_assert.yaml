appId: ${APP_ID}
name: "TC35 - Chat History Offline: Error + Retry Loads History"
# id: FC-ERR-04
# priority: P2
# requires: PHONE_NUMBER,OTP_CODE
# description: Chat history offline shows the no-internet screen; Try again online loads the history.
tags:
  - chat
  - error
  - regression
  - offline
# If any step fails while offline, turn airplane mode back off so the
# rest of the run isn't offline too.
onFlowComplete:
  - setAirplaneMode: disabled
---
# Chat history exists only for a signed-up user, so this signs in (one of
# the device's logins on every attempt).
- setAirplaneMode: disabled
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml
- runFlow: ../../helpers/full_signup.yaml

# ── Seed the history with one chat ──
- runFlow:
    file: ../../helpers/compose_typed_question.yaml
    env:
      QUESTION_TEXT: "How to grow wheat"
- evalScript: ${output.answerLabel = 'history_seed_answer'}
- runFlow: ../../helpers/wait_for_answer.yaml
- tapOn:
    id: "appbar_logo_left_btn"
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000
    label: "Back on home with one chat saved"

# ── Offline: open Chat History → no-internet screen ──
- setAirplaneMode: enabled
- runFlow: ../../helpers/open_drawer.yaml
- tapOn:
    id: "drawer_see_all_btn"
- extendedWaitUntil:
    visible:
      id: "error_screen"
    timeout: 30000
    label: "No-internet screen shown for Chat History"
- assertVisible:
    id: "error_btn_try_again"
    label: "It offers Try again"
- assertNotVisible:
    id: "chat_history_list"
    label: "History not shown offline"

# ── Back online: Try again until the history loads ──
# Wi-Fi takes a few seconds to reconnect, so the first tap can fail. Try
# again may also land on home; then reopen Chat History.
- setAirplaneMode: disabled
- retry:
    maxRetries: 5
    commands:
      - runFlow:
          when:
            visible:
              id: "error_btn_try_again"
          commands:
            - tapOn:
                id: "error_btn_try_again"
      - runFlow:
          when:
            visible:
              id: "home_screen"
          commands:
            - runFlow: ../../helpers/open_drawer.yaml
            - tapOn:
                id: "drawer_see_all_btn"
      - extendedWaitUntil:
          visible:
            id: "chat_history_list"
          timeout: 20000
          label: "Chat History loads"

# Loaded and not empty. No wording is matched: any text in the list is
# an entry (its title may be written by the AI).
- assertNotVisible:
    id: "error_screen"
    label: "No-internet screen gone"
- assertVisible:
    id: "chat_history_list"
    containsDescendants:
      - text: ".+"
    label: "History lists the saved chat"
