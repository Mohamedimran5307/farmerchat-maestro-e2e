appId: ${APP_ID}
name: "TC34 - No-Internet Error Screen Asserts on Cold Start"
# id: FC-ERR-01
# priority: P2
# description: Offline cold start shows the no-internet screen with Try again.
tags:
  - error
  - regression
  - offline
---
# Go fully offline, then cold-start so the launch hits the global no-internet error.
- setAirplaneMode: enabled
# - clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: "error_screen"
    timeout: 30000
- assertVisible:
    id: "error_btn_try_again"
# Restore connectivity so subsequent tests start online.
- setAirplaneMode: disabled
