appId: ${APP_ID}
name: "TC34 - Chat Offline: Inline Error + Retry Recovers"
# id: FC-ERR-03
# priority: P2
# description: Sending offline shows the chat error; Retry online gets the answer.
tags:
  - chat
  - error
  - regression
  - offline
# If any step fails while offline, turn airplane mode back off so the
# rest of the run isn't offline too.
onFlowComplete:
  - setAirplaneMode: disabled
---
- setAirplaneMode: disabled
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

# ── Offline: send a question → inline chat error (not the global one) ──
- setAirplaneMode: enabled
- runFlow:
    file: ../../helpers/compose_typed_question.yaml
    env:
      QUESTION_TEXT: "How to grow maize"
- extendedWaitUntil:
    visible:
      id: "chat_retry_btn"
    timeout: 5000
    label: "Inline 'No internet' error with Try again"
- assertVisible:
    id: "chat_screen"
    label: "Error shown inside the chat"
- assertNotVisible:
    id: "error_screen"
    label: "Not the full-screen no-internet error"

# ── Back online: Try again until the request goes through ──
# Wi-Fi takes a few seconds to reconnect, so the first tap can fail and
# bring the card back. Nothing scrolls inside this loop: the card has to
# stay in view to be tapped again.
- setAirplaneMode: disabled
- retry:
    maxRetries: 5
    commands:
      - runFlow:
          when:
            visible:
              id: "chat_retry_btn"
          commands:
            - tapOn:
                id: "chat_retry_btn"
      - extendedWaitUntil:
          visible:
            id: "chat_loading"
          timeout: 4000
          optional: true
      - extendedWaitUntil:
          notVisible:
            id: "chat_loading"
          timeout: 90000
      - assertNotVisible:
          id: "chat_retry_btn"
          label: "Try again went through (error card gone)"

# ── Complete answer ──
- evalScript: ${output.answerLabel = 'offline_retry_answer'}
- runFlow: ../../helpers/wait_for_answer.yaml
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_share_btn"
    direction: DOWN
    timeout: 10000
    label: "Scroll to the Share button"
- assertVisible:
    id: "chat_share_btn"
    label: "Share button shown on the answer"
