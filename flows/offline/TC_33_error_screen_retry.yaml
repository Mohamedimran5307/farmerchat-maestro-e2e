appId: ${APP_ID}
name: "TC33 - No-Internet Error: Retry Recovers to Language Screen"
# id: FC-ERR-02
# priority: P2
# description: Try again after going back online recovers from the no-internet screen.
tags:
  - error
  - regression
  - offline
# If any step fails while offline, turn airplane mode back off so the
# rest of the run isn't offline too.
onFlowComplete:
  - setAirplaneMode: disabled
---
# Go fully offline, then cold-start so the launch hits the global no-internet error.
- setAirplaneMode: enabled
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "error_screen"
    timeout: 30000
    label: "No-internet screen shown"
- assertVisible:
    id: "error_btn_try_again"
    label: "It offers Try again"

# Restore connectivity. Wi-Fi/data take a few seconds to reassociate after
# airplane mode is turned off, so the first "Try again" tap can fire before the
# network is back. Re-tap only while the error button is still showing, and wait
# generously for the language screen to load between attempts.
- setAirplaneMode: disabled
- retry:
    maxRetries: 5
    commands:
      - runFlow:
          when:
            visible:
              id: "error_btn_try_again"
          commands:
            - tapOn:
                id: "error_btn_try_again"
      - extendedWaitUntil:
          visible:
            id: "language_screen"
          timeout: 15000
# Final settle: extendedWaitUntil polls (unlike a bare assertVisible, which can
# catch a flicker mid-reconnect), so it serves as the recovery assertion.
- extendedWaitUntil:
    visible:
      id: "language_screen"
    timeout: 20000
    label: "Recovered to the language screen"
- assertNotVisible:
    id: "error_screen"
    label: "No-internet screen gone"
