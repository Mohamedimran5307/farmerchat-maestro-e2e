appId: ${APP_ID}
name: "TC21 - Settings: Toggle Display Mode (Day / Night / Auto)"
# id: FC-SET-01
# priority: P2
# description: Display mode cycles through Day, Night and Auto.
tags:
  - settings
  - regression
  - settings_help
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

# Open drawer → Settings
- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_settings_btn"
    timeout: 5000
- tapOn:
    id: "drawer_settings_btn"
- extendedWaitUntil:
    visible:
      id: "settings_screen"
    timeout: 5000

# Cycle through the three appearance modes: the tapped one becomes the
# selected option (checked) and the previous one is released. Ends on
# Auto, the default.
- tapOn:
    id: "settings_btn_appearance_day"
- assertVisible:
    id: "settings_btn_appearance_day"
    checked: true
    label: "Day is selected"
- assertNotVisible:
    id: "settings_btn_appearance_auto"
    checked: true
    label: "Auto is no longer selected"

- tapOn:
    id: "settings_btn_appearance_night"
- assertVisible:
    id: "settings_btn_appearance_night"
    checked: true
    label: "Night is selected"
- assertNotVisible:
    id: "settings_btn_appearance_day"
    checked: true
    label: "Day is no longer selected"

- tapOn:
    id: "settings_btn_appearance_auto"
- assertVisible:
    id: "settings_btn_appearance_auto"
    checked: true
    label: "Auto is selected"
- assertNotVisible:
    id: "settings_btn_appearance_night"
    checked: true
    label: "Night is no longer selected"
