appId: ${APP_ID}
name: "TC26 - Help: Open Terms of Use"
# id: FC-HELP-02
# priority: P2
# description: Help opens the Terms of Use.
# TODO: help_terms_of_use testTag carries over from the old APK and
# needs a live-device confirmation on the new build. May now be
# help_btn_terms or similar.
tags:
  - help
  - regression
  - settings_help
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_help_btn"
    timeout: 5000
- tapOn:
    id: "drawer_help_btn"
- extendedWaitUntil:
    visible:
      id: "help_screen"
    timeout: 5000

- tapOn:
    id: "help_item_terms"

- extendedWaitUntil:
    visible:
      text: "Terms of Use"
    timeout: 15000
- assertVisible:
    text: "Terms of Use"
