appId: ${APP_ID}
name: "TC25 - Help: Open Privacy Policy"
# id: FC-HELP-03
# priority: P2
# description: Help opens the Privacy Policy.
tags:
  - help
  - regression
  - settings_help
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_help_btn"
    timeout: 5000
- tapOn:
    id: "drawer_help_btn"
- extendedWaitUntil:
    visible:
      id: "help_screen"
    timeout: 5000

- tapOn:
    id: "help_item_privacy"

# The Privacy Policy page opens (by its tags; its title is in the app's language).
- extendedWaitUntil:
    visible:
      id: "legal_document_screen"
    timeout: 15000
    label: "Privacy Policy page opens"
- assertVisible:
    id: "legal_document_title"
    text: ".+"
    label: "Privacy Policy page shows its title"
- assertNotVisible:
    id: "help_screen"
    label: "Privacy Policy page replaced Help"
