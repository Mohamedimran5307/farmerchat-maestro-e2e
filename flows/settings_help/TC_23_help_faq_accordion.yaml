appId: ${APP_ID}
name: "TC23 - Help: FAQ Accordion Expands With Answer"
# id: FC-HELP-01
# priority: P2
# description: Tapping an FAQ question in Help expands its answer.
# TODO: help_list_faqs / help_faq_item_0 (renamed from faqs-en / faq-01-en
# in 4.1.x) need a live-device confirmation on the new build. The FAQ
# question text ("What is FarmerChat...") and answer body may also
# have been edited — refresh both after the first inspection.
tags:
  - help
  - regression
  - settings_help
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_help_btn"
    timeout: 5000
- tapOn:
    id: "drawer_help_btn"
- extendedWaitUntil:
    visible:
      id: "help_screen"
    timeout: 5000

# Verify the Help section heading rendered, then expand the first FAQ.
- assertVisible: "How to use FarmerChat"
- tapOn: "What is FarmerChat and how can it help me?"

- extendedWaitUntil:
    visible:
      id: "help_list_faqs"
    timeout: 10000
- assertVisible:
    id: "help_faq_item_0"
