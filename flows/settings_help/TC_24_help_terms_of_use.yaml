appId: ${APP_ID}
name: "TC24 - Help: Open Terms of Use"
# id: FC-HELP-02
# priority: P2
# description: Help opens the Terms of Use.
tags:
  - help
  - regression
  - settings_help
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_help_btn"
    timeout: 5000
- tapOn:
    id: "drawer_help_btn"
- extendedWaitUntil:
    visible:
      id: "help_screen"
    timeout: 5000

- tapOn:
    id: "help_item_terms"

# The Terms of Use page opens (by its tags; its title is in the app's language).
- extendedWaitUntil:
    visible:
      id: "legal_document_screen"
    timeout: 15000
    label: "Terms of Use page opens"
- assertVisible:
    id: "legal_document_title"
    text: ".+"
    label: "Terms of Use page shows its title"
- assertNotVisible:
    id: "help_screen"
    label: "Terms of Use page replaced Help"
