appId: ${APP_ID}
name: "TC03 - Typed Question → Answer → Follow-up → Back to Home"
# id: FC-CHAT-01
# priority: P0
# description: Typed question gets a complete answer; a follow-up question gets one too.
tags:
  - home
  - chat
  - regression
  - smoke
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- runFlow: ../../helpers/composer_focus_text.yaml
- inputText: "What type of fertilizer should I use for tomatoes for better growth and yield?"
- hideKeyboard
- runFlow: ../../helpers/composer_send.yaml
- evalScript: ${output.answerLabel = 'first_answer'}
# The one test that handles what the agent posts after the answer
# (confirmation cards such as save crop / gender, if one appears) and
# checks the follow-up questions; every other chat test stops at Share.
- evalScript: ${output.handleFollowUps = true}
- runFlow: ../../helpers/wait_for_answer.yaml

# The answer ends with its action row and the follow-up questions
# (on agentic builds they come after any confirmation card, at the end).
- scrollUntilVisible:
    centerElement: true
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 15000
    label: "Scroll to the follow-up questions"
- assertVisible:
    id: "chat_suggested_questions"
    label: "Follow-up questions shown after the answer"
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_share_btn"
    direction: UP
    timeout: 10000
    label: "Scroll to the Share button"
- assertVisible:
    id: "chat_share_btn"
    label: "Share button shown on the answer"

# Follow-up through the first suggested question (after any confirmation,
# the suggestions appear at the end of the chat).
- runFlow: ../../helpers/followup_via_suggestion.yaml

# Back arrow returns to home.
- tapOn:
    id: "appbar_logo_left_btn"
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000
