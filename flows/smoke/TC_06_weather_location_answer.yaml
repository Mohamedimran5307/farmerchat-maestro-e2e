appId: ${APP_ID}
name: "TC06 - Weather → Share Location (granted) → Answer"
# id: FC-LOC-01
# priority: P0
# description: Weather asks for location; once granted, a complete weather answer arrives.
tags:
  - home
  - regression
  - smoke
---
# Clean state so the grant path runs on every run: the app skips the
# share-location screen when it has a saved location from an earlier
# run, and Android stops showing the prompt after repeated denials — so
# clear the app data and reset location to "never asked" (unset), not
# "denied".
- launchApp:
    clearState: true
    permissions:
      location: unset
- runFlow: ../../helpers/complete_onboarding.yaml

- assertVisible:
    id: "home_weather_button"
    containsDescendants:
      - text: ".*°.*"
    label: "Weather button shows a temperature"

# ── First visit: the whole grant path must run (location not granted) ──
- tapOn:
    id: "home_weather_button"
- extendedWaitUntil:
    visible:
      id: "location_interstitial_cta_btn"
    timeout: 15000
    label: "Share-location screen shown (location not granted yet)"
- tapOn:
    id: "location_interstitial_cta_btn"
- extendedWaitUntil:
    visible:
      id: "com.android.permissioncontroller:id/permission_allow_foreground_only_button|com.android.permissioncontroller:id/permission_allow_button"
    timeout: 10000
    label: "System location prompt shown"
- runFlow: ../../helpers/grant_runtime_permission.yaml
# Google's location-accuracy pop-up (device-dependent).
- runFlow:
    when:
      visible: "No thanks"
    commands:
      - tapOn: "No thanks"
- evalScript: ${output.answerLabel = 'weather_answer'}
- runFlow: ../../helpers/wait_for_answer.yaml
- assertNotVisible:
    id: "chat_clarification_card_location"
    label: "Chat didn't ask for location after it was granted"
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_share_btn"
    direction: DOWN
    timeout: 10000
    label: "Scroll to the Share button"
- assertVisible:
    id: "chat_share_btn"
    label: "Share button shown on the answer"
- tapOn:
    id: "appbar_logo_left_btn"
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000
    label: "Back on the home screen"
