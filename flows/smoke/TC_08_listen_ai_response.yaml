appId: ${APP_ID}
name: "TC08 - Listen to AI Response (TTS Playback)"
# id: FC-TTS-01
# priority: P0
# quarantine: App bug (P0, TESTTAG_REQUESTS_CRITICAL.md item 2) — on the 2 Nov build the Listen button's node collapses to 34 px in the accessibility tree, so its state tags flicker; passed 1 of 3 (reports/logs_02Nov2026_122720). Remove after 3 clean passes on a fixed build.
# description: Listen plays an answer aloud and pauses on a second tap.
tags:
  - home
  - chat
  - regression
  - smoke
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml
- runFlow:
    file: ../../helpers/compose_typed_question.yaml
    env:
      QUESTION_TEXT: "What are common tomato diseases"
- evalScript: ${output.answerLabel = 'tts_question_answer'}
- runFlow: ../../helpers/wait_for_answer.yaml

# Centre the Listen button before tapping it, so the whole button is on
# screen. Tapped where it first appears, it can sit at the bottom edge with
# only 24 px showing above the composer (seen 3 Nov, when the pause check
# failed). First let the chat finish posting what follows the
# answer (suggestions or a card) — that moves the row, and it gives the
# row room below to scroll up to the middle; then scroll back up to it.
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_suggested_questions|chat_confirmation_card"
    direction: DOWN
    timeout: 20000
    optional: true
- scrollUntilVisible:
    centerElement: true
    element:
      id: "chat_listen_btn"
    direction: UP
    timeout: 20000
    speed: 20
    label: "Listen button centred on screen"

# Playback state via testTags (4.1.7+): idle → loading → playing → paused.
- assertVisible:
    id: "chat_listen_state_idle"
- tapOn:
    id: "chat_listen_btn"
# The TTS engine fetches audio first (loading); a cold engine can take 20–40s.
- extendedWaitUntil:
    visible:
      id: "chat_listen_state_playing"
    timeout: 60000
- tapOn:
    id: "chat_listen_btn"
- extendedWaitUntil:
    visible:
      id: "chat_listen_state_paused"
    timeout: 5000
