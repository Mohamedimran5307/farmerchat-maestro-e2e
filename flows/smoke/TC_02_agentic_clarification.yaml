appId: ${APP_ID}
name: "TC02 - Agentic: Vague Question → Clarification → Answer"
# id: FC-AGENT-01
# priority: P0
# requires: AGENTIC=true
# description: Positive proof that the agentic chat works. From a clean install (no crop, no location known), sends a deliberately vague question and REQUIRES the agent to ask a clarification card (chat_clarification_card) instead of answering blindly — fails if it never asks. Taps the first chip of each card (photo card: the 3rd chip, continue without a photo) and the first chip of any confirmation, waiting for the agent between taps. Then a complete answer must arrive (action row, no inline error or failure reply, real text, within ANSWER_SLA_MS) showing its follow-up questions and Share button. Functional only — what the AI says is covered by the evals project.
tags:
  - chat
  - regression
  - smoke
---
# Clean state so the agent can't fill the gaps from a saved profile.
- launchApp:
    clearState: true
- runFlow: ../../helpers/complete_onboarding.yaml

- runFlow: ../../helpers/composer_focus_text.yaml
- inputText: "How do I control pests on my farm?"
- hideKeyboard
- runFlow: ../../helpers/composer_send.yaml

# The agent must ask before answering (no crop/location context given).
- extendedWaitUntil:
    visible:
      id: "chat_clarification_card"
    timeout: 60000
    label: "Agent asked a clarification for a vague question"

# Tap first chips until the answer comes.
- evalScript: ${output.answerLabel = 'agentic_answer'}
- runFlow: ../../helpers/wait_for_answer.yaml
- assertTrue:
    condition: ${output.clarifications >= 1}
    label: "At least one clarification was answered before the answer"

# The answer ends with its action row and the follow-up questions
# ("You can also ask"; on agentic builds they come after any
# confirmation card, at the end of the chat).
- scrollUntilVisible:
    centerElement: true
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 15000
    label: "Scroll to the follow-up questions"
- assertVisible:
    id: "chat_suggested_questions"
    label: "Follow-up questions shown after the answer"
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_share_btn"
    direction: UP
    timeout: 10000
    label: "Scroll to the Share button"
- assertVisible:
    id: "chat_share_btn"
    label: "Share button shown on the answer"
