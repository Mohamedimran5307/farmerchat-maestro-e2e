appId: ${APP_ID}
name: "TC07 - Account Lifecycle: Sign Up → History → Log Out"
# id: FC-AUTH-01
# priority: P0
# requires: PHONE_NUMBER,OTP_CODE
# description: Sign up with phone and OTP, reopen this run's chat from Chat History, then log out.
# VERIFY ON DEVICE: that Chat History rows show the question text (the
# unique run id is matched there).
tags:
  - auth
  - chat
  - regression
  - smoke
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

# ── Sign up (logs out first if a previous test left a session) ──
- runFlow: ../../helpers/full_signup.yaml
- runFlow: ../../helpers/navigate_to_settings.yaml
- assertVisible:
    id: "settings_btn_logout"
    label: "Signed in: Settings offers Logout"
- back
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 10000

# ── Seed history with a question only this run could have asked ──
# A specific question the agent answers directly (3/3 on 3 Nov): "How to
# grow maize" made it ask "Please Confirm" (plan or overview) first — an
# extra turn this test doesn't need.
- evalScript: ${output.runTag = 'run' + String(Date.now()).slice(-6)}
- runFlow: ../../helpers/composer_focus_text.yaml
- inputText: ${'What is the seed rate for maize per acre? test ' + output.runTag}
- hideKeyboard
- runFlow: ../../helpers/composer_send.yaml
- evalScript: ${output.answerLabel = 'history_seed_answer'}
- runFlow: ../../helpers/wait_for_answer.yaml
- tapOn:
    id: "appbar_logo_left_btn"
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000

# ── Side menu → See all → that exact conversation → reopens ──
- tapOn:
    id: "home_hamburger_button"
- extendedWaitUntil:
    visible:
      id: "drawer_see_all_btn"
    timeout: 10000
- tapOn:
    id: "drawer_see_all_btn"
- extendedWaitUntil:
    visible:
      id: "chat_history_list"
    timeout: 15000
- tapOn:
    text: ${'.*' + output.runTag + '.*'}
- extendedWaitUntil:
    visible:
      id: "chat_screen"
    timeout: 15000
# The chat reopens on its latest turn; if the agent asked a clarification
# first, this run's question sits above it, off screen.
- scrollUntilVisible:
    centerElement: false
    element:
      text: ${'.*' + output.runTag + '.*'}
    direction: UP
    timeout: 20000
    label: "Scroll up to this run's question"
- assertVisible:
    text: ${'.*' + output.runTag + '.*'}
    label: "Reopened conversation is this run's question"

# ── Log out, then relaunch: the session must be gone ──
- launchApp
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000
- runFlow: ../../helpers/navigate_to_settings.yaml
- tapOn:
    id: "settings_btn_logout"
- extendedWaitUntil:
    visible:
      id: "language_screen"
    timeout: 15000
- launchApp
- extendedWaitUntil:
    visible:
      id: "language_screen"
    timeout: 15000
- assertNotVisible:
    id: "home_screen"
    label: "Still logged out after relaunch"
