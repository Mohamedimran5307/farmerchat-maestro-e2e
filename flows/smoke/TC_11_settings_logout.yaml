appId: ${APP_ID}
name: "TC11 - Sign Up + Logout via Settings"
# priority: P0
# requires: PHONE_NUMBER,OTP_CODE
# description: Complete auth lifecycle test: signs up via the drawer (phone + OTP), navigates to Settings, taps the auth entry (now showing Logout when signed in), and confirms the user is returned to the first-launch language screen as a fresh session.
tags:
  - settings
  - auth
  - regression
  - smoke
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml
- runFlow: ../../helpers/full_signup.yaml

# ── Open drawer → Settings ──
- runFlow: ../../helpers/navigate_to_settings.yaml

# ── Tap Logout in Settings (same testTag as Sign Up; text flips with auth state) ──
- tapOn:
    id: "settings_btn_auth"
    containsChild:
      text: "Log ?out"

# ── Assert navigated back to language screen ──
- extendedWaitUntil:
    visible:
      id: "language_screen"
    timeout: 15000
