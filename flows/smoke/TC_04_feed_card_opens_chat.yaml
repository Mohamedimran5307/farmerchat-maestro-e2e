appId: ${APP_ID}
name: "TC04 - First Feed Card → Ask Now → Answer"
# id: FC-FEED-01
# priority: P0
# description: First feed card's Ask Now opens a chat with a complete answer.
tags:
  - home
  - regression
  - smoke
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

# Feed loaded; remember the first content card's question
# (content_card_question; first in the list = top of the feed).
- extendedWaitUntil:
    visible:
      id: "content_card_start_chat_btn_[0-9]+"
    timeout: 20000
- copyTextFrom:
    id: "content_card_question"
    index: 0
# Escape regex metacharacters so the question can be used as a selector.
- evalScript: ${output.firstQ = maestro.copiedText.replace(/\\/g, '\\\\').replace(/\?/g, '\\?').replace(/\./g, '\\.').replace(/\(/g, '\\(').replace(/\)/g, '\\)').replace(/\*/g, '\\*').replace(/\+/g, '\\+')}

# That card's own Ask Now (the CTA directly below its question).
- evalScript: ${output.answerLabel = 'card_answer'}
- tapOn:
    id: "content_card_start_chat_btn_[0-9]+"
    below:
      text: ${output.firstQ}

# Chat opens on the same question.
- extendedWaitUntil:
    visible:
      id: "chat_screen"
    timeout: 10000
# Expand "Read full advice" when the card offers it (content-dependent).
- runFlow: ../../helpers/open_full_advice.yaml
- runFlow: ../../helpers/wait_for_answer.yaml

# The answer ends with its action row and the follow-up questions
# ("You can also ask"; on agentic builds they come after any confirmation
# card, at the end of the chat). Tapping a suggestion is covered by
# FC-CHAT-01 (TC03).
- scrollUntilVisible:
    centerElement: true
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 15000
    label: "Scroll to the follow-up questions"
- assertVisible:
    id: "chat_suggested_questions"
    label: "Follow-up questions shown after the answer"
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_share_btn"
    direction: UP
    timeout: 10000
    label: "Scroll to the Share button"
- assertVisible:
    id: "chat_share_btn"
    label: "Share button shown on the answer"
