appId: ${APP_ID}
name: "TC02 - Type a Question → AI Response with Suggestions"
# priority: P0
# description: Validates the core typed-question chat experience: types into the composer, submits a farming question, waits for the AI answer to stream in with its suggested-questions block, then exercises a follow-up turn by tapping the first suggested question and verifying a second answer renders.
tags:
  - home
  - chat
  - regression
  - critical
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

# Focus the composer text field and type the question.
- runFlow: ../../helpers/composer_focus_text.yaml
- inputText: "What type of fertilizer should I use for tomatoes for better growth and yield?"
- hideKeyboard
# Capture send-tap time for the first-answer latency benchmark.
- evalScript: ${output.t_send_first = Date.now()}
- runFlow: ../../helpers/composer_send.yaml

# scrollUntilVisible waits up to 90s for chat_suggested_questions, which
# only appears once the answer is fully streamed — that's the implicit
# "wait for AI response".
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 90000
    speed: 75
# Latency line is emitted via console.log → Maestro's internal maestro.log
# (NOT the CLI stdout). build_latency_chips() in run_tests.sh picks this
# up and renders a chip in the HTML report.
- evalScript: ${console.log('[TC02-LATENCY] first_answer_ms=' + (Date.now() - output.t_send_first))}

# Tap the first suggested question. The block can count as visible while
# its rows are still hidden under the composer bar, so scroll the first
# row itself into view.
- scrollUntilVisible:
    centerElement: true
    element:
      id: "chat_suggested_question_0"
    direction: DOWN
    timeout: 10000
- evalScript: ${output.t_send_followup = Date.now()}
- tapOn:
    id: "chat_suggested_question_0"
    waitToSettleTimeoutMs: 500

# The chat jumps to the new turn, taking the first answer's suggestions
# off screen. Waiting for that (instead of a fixed animation wait) makes
# sure the next check sees the follow-up's block, not the old one.
- extendedWaitUntil:
    notVisible:
      id: "chat_suggested_questions"
    timeout: 10000

# Same pattern for the follow-up answer.
- scrollUntilVisible:
    centerElement: true
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 90000
    speed: 75
- evalScript: ${console.log('[TC02-LATENCY] followup_answer_ms=' + (Date.now() - output.t_send_followup))}