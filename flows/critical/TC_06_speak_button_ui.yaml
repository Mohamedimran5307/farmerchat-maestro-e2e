appId: ${APP_ID}
name: "TC06 - Speak Button Opens Voice-Input Overlay"
# priority: P2
# description: Verifies the voice-input UI: taps the composer Voice button on home (granting the mic prompt on a fresh install), confirms the voice-input overlay with its 'Listening...' state appears, sends with no speech and confirms the app offers Retry, then goes back to the home screen.
tags:
  - home
  - regression
  - critical
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- runFlow: ../../helpers/composer_tap_voice.yaml

# Voice-input overlay appears in its listening state.
- extendedWaitUntil:
    visible:
      text: "Listening..."
    timeout: 5000

# Send without speaking: the app can't transcribe anything and offers
# Retry. Short settle timeout — the overlay animates while listening.
- extendedWaitUntil:
    visible:
      id: "chat_voice_input_send_btn"
    timeout: 5000
- tapOn:
    id: "chat_voice_input_send_btn"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "chat_retry_btn"
    timeout: 15000

# Back to home.
- back
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 5000
