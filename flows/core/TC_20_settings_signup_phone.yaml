appId: ${APP_ID}
name: "TC20 - Settings → Sign Up: Phone-Input Screen"
# id: FC-AUTH-04
# priority: P1
# requires: PHONE_NUMBER,OTP_CODE
# description: Settings Sign up opens the phone-number screen.
tags:
  - settings
  - auth
  - regression
  - core
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml
# Sign-up entry is only shown when signed out.
- runFlow: ../../helpers/ensure_signed_out.yaml

- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_settings_btn"
    timeout: 5000
- tapOn:
    id: "drawer_settings_btn"
- extendedWaitUntil:
    visible:
      id: "settings_screen"
    timeout: 5000

# In the new APK both "Sign up" and "Logout" share the testTag
# settings_btn_signup / settings_btn_logout — one tag per auth state (4.1.7+).
# When signed out (this TC starts there), tapping it leads to the
# signup flow.
- tapOn:
    id: "settings_btn_signup"

# Some builds insert an intermediate "account benefits" screen before
# the phone-input page.
- runFlow:
    when:
      visible:
        id: "account_benefits_btn_signup"
    commands:
      - tapOn:
          id: "account_benefits_btn_signup"

- extendedWaitUntil:
    visible:
      id: "auth_screen"
    timeout: 10000
- assertVisible:
    id: "auth_phone_input"
