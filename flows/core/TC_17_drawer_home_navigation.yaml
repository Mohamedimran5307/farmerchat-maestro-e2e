appId: ${APP_ID}
name: "TC17 - Side Menu Home Returns From Help Screen"
# id: FC-NAV-02
# priority: P2
# description: Side menu Home returns from the Help screen to home.
# TODO: help_hamburger_button is the old APK's id for the hamburger
# inside Help. The new APK likely reuses appbar_default_left_btn
# (the generic appbar back/menu icon) or a dedicated help_appbar id.
# Live-inspect Help and replace this id if needed.
tags:
  - navigation
  - regression
  - core
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

# Navigate from Home → Help via the drawer.
- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_help_btn"
    timeout: 5000
- tapOn:
    id: "drawer_help_btn"
- extendedWaitUntil:
    visible:
      id: "help_screen"
    timeout: 5000

# Open the drawer from Help and tap Home to navigate back.
- tapOn:
    id: "appbar_default_left_btn"
- extendedWaitUntil:
    visible:
      id: "drawer_home_btn"
    timeout: 5000
- tapOn:
    id: "drawer_home_btn"

- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 10000
- assertVisible:
    id: "home_screen"
