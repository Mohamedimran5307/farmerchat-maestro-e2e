appId: ${APP_ID}
name: "TC10 - Speak Button Opens Voice-Input Overlay"
# id: FC-VOICE-01
# priority: P2
# description: Voice button opens the listening overlay; no speech offers Retry.
tags:
  - home
  - regression
  - core
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- runFlow: ../../helpers/composer_tap_voice.yaml

# Voice-input overlay appears in its listening state.
- extendedWaitUntil:
    visible:
      text: "Listening..."
    timeout: 5000

# Send without speaking: the app can't transcribe anything and offers
# Retry. Short settle timeout — the overlay animates while listening.
- extendedWaitUntil:
    visible:
      id: "chat_voice_input_send_btn"
    timeout: 5000
- tapOn:
    id: "chat_voice_input_send_btn"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "chat_retry_btn"
    timeout: 15000
- assertVisible:
    id: "chat_retry_btn"