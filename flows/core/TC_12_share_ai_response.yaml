appId: ${APP_ID}
name: "TC12 - Share AI Response via System Chooser"
# id: FC-CHAT-02
# priority: P1
# description: Share on an answer opens the Android share sheet.
# TODO: chat_share_btn lost its testTag on some builds of the new APK.
# If the lookup starts timing out, fall back to a text:"Share" matcher
# or escalate to the app team.
tags:
  - home
  - chat
  - regression
  - core
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml
- runFlow:
    file: ../../helpers/compose_typed_question.yaml
    env:
      QUESTION_TEXT: "How to prevent maize rust disease"

# Wait for the complete answer (handles agentic chips; no scrolling
# while the answer is generated).
- evalScript: ${output.answerLabel = 'share_answer'}
- runFlow: ../../helpers/wait_for_answer.yaml

# Scroll up to the action row to bring chat_share_btn into a tappable position.
- scrollUntilVisible:
    centerElement: true
    element:
      id: "chat_share_btn"
    direction: UP
    timeout: 10000
- tapOn:
    id: "chat_share_btn"

# The phone's share sheet opened, whatever the brand (Vivo, Samsung,
# Xiaomi, stock Android …): an element of another app (pkg:id/…), not the
# status bar. FarmerChat's own tags have no "pkg:id/" prefix.
- extendedWaitUntil:
    visible:
      id: "(?!com\\.android\\.systemui:)[a-zA-Z][\\w.]*:id/.+"
    timeout: 10000
    label: "Phone's share sheet opened"

# Soft: FarmerChat's share message in the sheet's preview (Vivo shows one;
# other phones may not) — a warning if missing, not a failure.
- extendedWaitUntil:
    visible:
      text: "Sharing what FarmerChat taught me—super useful. 👍🏾 https://farmerchat.go.link/clujT"
    timeout: 3000
    optional: true
    label: "Share message shown in the sheet (soft check)"

