appId: ${APP_ID}
name: "TC11 - Full Sign Up via Settings (Phone + OTP → Signed In)"
# id: FC-AUTH-02
# priority: P0
# requires: PHONE_NUMBER,OTP_CODE
# description: Sign up from Settings with phone and OTP; Settings then shows Logout.
tags:
  - settings
  - auth
  - regression
  - core
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml
# Sign-up entry is only shown when signed out.
- runFlow: ../../helpers/ensure_signed_out.yaml

# Side menu → Settings → Sign Up (settings_btn_signup while signed out,
# settings_btn_logout once signed in).
- runFlow: ../../helpers/navigate_to_settings.yaml
- tapOn:
    id: "settings_btn_signup"

# Optional account-benefits intermediate screen (some builds insert it)
- runFlow:
    when:
      visible:
        id: "account_benefits_btn_signup"
    commands:
      - tapOn:
          id: "account_benefits_btn_signup"

# Phone step
- extendedWaitUntil:
    visible:
      id: "auth_phone_input"
    timeout: 10000
- tapOn:
    id: "auth_phone_input"
- inputText: "${PHONE_NUMBER}"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "auth_send_sms_btn"
    timeout: 5000
- tapOn:
    id: "auth_send_sms_btn"

# OTP step
- extendedWaitUntil:
    visible:
      id: "auth_otp_input"
    timeout: 30000
- tapOn:
    id: "auth_otp_input"
- inputText: "${OTP_CODE}"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "auth_verify_btn"
    timeout: 5000
- tapOn:
    id: "auth_verify_btn"

# Success → Continue → Home (4.1.5 returns to Home, not Settings).
- extendedWaitUntil:
    visible:
      id: "account_success_screen"
    timeout: 30000
- tapOn:
    id: "account_success_btn_continue"
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000

# Signed in: Settings auth entry has flipped to Logout.
- runFlow: ../../helpers/navigate_to_settings.yaml
- assertVisible:
    id: "settings_btn_logout"
