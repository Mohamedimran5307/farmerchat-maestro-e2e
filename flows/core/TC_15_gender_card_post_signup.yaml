appId: ${APP_ID}
name: "TC15 - Gender Card Renders After Sign-Up + Location"
# id: FC-PROF-01
# priority: P1
# requires: PHONE_NUMBER,OTP_CODE
# description: After sign-up and location, the gender card shows all its options.
tags:
  - home
  - regression
  - core
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml
- runFlow: ../../helpers/full_signup.yaml
- runFlow: ../../helpers/weather_share_location_and_back_home.yaml

# ── Assert the gender card and its four options are visible ──
# The gender card is Firebase-flag gated — if the flag is off the card
# never appears and this assertion fails. That's intentional, this TC's
# entire purpose is to verify the gender card is rendered.
- extendedWaitUntil:
    visible:
      id: "home_feed_list"
    timeout: 15000
- scrollUntilVisible:
    centerElement: true
    element:
      id: "home_feed_card_gender"
    direction: DOWN
    timeout: 60000
    speed: 40
- assertVisible:
    id: "home_feed_card_gender"
# All four select-option rows must be present.
- assertVisible:
    id: "single_select_card_option_0"
- assertVisible:
    id: "single_select_card_option_1"
- assertVisible:
    id: "single_select_card_option_2"
- assertVisible:
    id: "single_select_card_option_3"
