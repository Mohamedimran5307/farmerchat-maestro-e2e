appId: ${APP_ID}
name: "TC17 - Drawer: Change Language"
# id: FC-NAV-01
# priority: P2
# description: Changing the language from the side menu shows a confirmation.
# TODO: language_chooser_screen and language_chooser_save_button
# testTags carry over from the old APK; the new APK may use the same
# language_screen / language_start_button ids the first-launch flow
# uses, or new ones. Inspect after first run.
tags:
  - navigation
  - regression
  - core
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_language_btn"
    timeout: 5000
- tapOn:
    id: "drawer_language_btn"

- extendedWaitUntil:
    visible:
      id: "language_chooser_screen"
    timeout: 5000

- tapOn:
    id: "language_chooser_item_en"

- tapOn:
    id: "language_chooser_save_button"
