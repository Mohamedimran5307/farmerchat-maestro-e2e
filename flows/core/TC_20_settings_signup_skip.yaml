appId: ${APP_ID}
name: "TC20 - Settings → Sign Up → Skip / Close Returns to Settings"
# id: FC-AUTH-05
# priority: P2
# requires: PHONE_NUMBER,OTP_CODE
# description: Leaving sign-up from Settings without signing up returns to Settings.
# On the 2 Nov build Settings → Sign Up opens either the account-benefits
# screen (left with Skip) or, on some visits, the phone-number screen
# directly (left with its X). Both must land back on Settings.
tags:
  - settings
  - auth
  - regression
  - core
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml
# Sign-up entry is only shown when signed out.
- runFlow: ../../helpers/ensure_signed_out.yaml

- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_settings_btn"
    timeout: 5000
- tapOn:
    id: "drawer_settings_btn"
- extendedWaitUntil:
    visible:
      id: "settings_screen"
    timeout: 5000

- tapOn:
    id: "settings_btn_signup"

# Benefits screen → Skip; phone-number screen → X.
- extendedWaitUntil:
    visible:
      id: "account_benefits_btn_signup|auth_screen"
    timeout: 10000
- runFlow:
    when:
      visible:
        id: "account_benefits_btn_skip"
    commands:
      - tapOn:
          id: "account_benefits_btn_skip"
- runFlow:
    when:
      visible:
        id: "auth_screen"
    commands:
      - tapOn:
          id: "appbar_default_left_btn"

- extendedWaitUntil:
    visible:
      id: "settings_screen"
    timeout: 5000
- assertVisible:
    id: "settings_btn_signup"
    label: "Still signed out (Sign Up still offered)"
