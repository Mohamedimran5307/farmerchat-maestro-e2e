appId: ${APP_ID}
name: "TC22 - Settings → Sign Up → Skip Returns to Settings"
# id: FC-AUTH-05
# priority: P2
# requires: PHONE_NUMBER,OTP_CODE
# description: Validates the Skip path on the account-benefits intermediate screen: enters the sign-up flow from Settings, taps Skip, and confirms the user is returned to the Settings screen without completing sign-up.
# TODO: The "Skip" CTA on the account-benefits screen doesn't have a
# confirmed testTag yet. Currently using a text:"Skip" matcher; once
# the new APK is inspected, replace with an id like
# account_benefits_btn_skip if available.
tags:
  - settings
  - auth
  - regression
  - core
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml
# Sign-up entry is only shown when signed out.
- runFlow: ../../helpers/ensure_signed_out.yaml

- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_settings_btn"
    timeout: 5000
- tapOn:
    id: "drawer_settings_btn"
- extendedWaitUntil:
    visible:
      id: "settings_screen"
    timeout: 5000

- tapOn:
    id: "settings_btn_signup"

# Wait for the account-benefits screen, then tap Skip.
- extendedWaitUntil:
    visible:
      id: "account_benefits_btn_signup"
    timeout: 10000
- tapOn: "Skip"

- extendedWaitUntil:
    visible:
      id: "settings_screen"
    timeout: 5000
- assertVisible:
    id: "settings_screen"
